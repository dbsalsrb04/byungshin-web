<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">

        <title>BYUNGSHIN WEB - CLIMBING RECORDS</title>
        <link href="../pictures/smile-mingyu.jpg" rel="shortcut icon" type="image/x-icon">

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="climbing.js" defer></script>
        <link rel="stylesheet" href="climbing.css">
        <link rel="stylesheet" href="climbing_chart.css">
        <link rel="stylesheet" href="button.css">
        <link rel="stylesheet" href="../../card.css">
    </head>

    <body onload="init()">
        <a href="../../index.html">HOME</a>
        <h1>클라이밍 기록</h1>
        * <b>모바일</b>의 경우<br>
        * 화면을 <b>최대로 축소</b>해주세요!
        <hr>

        <div id="success_chart_container">
            <canvas id="success-rate-chart"></canvas>
        </div>

        <!-- 차트 편집 버튼 -->
        <span>- 차트 편집 -</span>
        <div id="edit-chart-button-grid">
            <div id="edit-to-success-rate" class="edit-chart-button" onclick="editChartToSuccessRate('success-rate-chart')">난이도별 완등률</div>
            <select id="edit-chart-to-by-spot" class="edit-chart-dropdown" onchange="editChartToSuccessRateBySpot('success-rate-chart', this.value)">
                <option value="" selected disabled>지점 선택</option>
                <option value="더클라임 양재">더클라임 양재</option>
                <option value="더클라임 강남">더클라임 강남</option>
                <option value="더클라임 논현">더클라임 논현</option>
                <option value="더클라임 신사">더클라임 신사</option>
                <option value="더클라임 성수">더클라임 성수</option>
                <option value="더클라임 사당">더클라임 사당</option>
                <option value="더클라임 이수">더클라임 이수</option>
                <option value="더클라임 신림">더클라임 신림</option>
                <option value="더클라임 문래">더클라임 문래</option>
                <option value="더클라임 연남">더클라임 연남</option>
                <option value="더클라임 마곡">더클라임 마곡</option>
                <option value="더클라임 일산">더클라임 일산</option>
            </select>
            <div id="edit-to-last-10" class="edit-chart-button" onclick="editChartToLast10Records('success-rate-chart')">지난 10개(아직 X)</div>
        </div>
        
        <!-- 색상 표시 버튼 -->
        <div id="color-display-button-bar">
            <button class="display_button" style="--color:#000000;" id="black_display_button" onclick="display_column('black')">숨기기</button>
            <button class="display_button" style="--color:#A52A2A;" id="brown_display_button" onclick="display_column('brown')">숨기기</button>
            <button class="display_button" style="--color:#808080;" id="gray_display_button" onclick="display_column('gray')">숨기기</button>
            <button class="display_button" style="--color:#800080;" id="purple_display_button" onclick="display_column('purple')">숨기기</button>
            <button class="display_button" style="--color:#FF00FF;" id="pink_display_button" onclick="display_column('pink')">숨기기</button>
            <button class="display_button" style="--color:#FF0000;" id="red_display_button" onclick="display_column('red')">숨기기</button>
            <button class="display_button" style="--color:#0000FF;" id="blue_display_button" onclick="display_column('blue')">숨기기</button>
            <button class="display_button" style="--color:#00FF00;" id="green_display_button" onclick="display_column('green')">숨기기</button>
            <button class="display_button" style="--color:#FF8000;" id="orange_display_button" onclick="display_column('orange')">숨기기</button>
            <button class="display_button" style="--color:#FFFF00;" id="yellow_display_button" onclick="display_column('yellow')">숨기기</button>
            <button class="display_button" style="--color:#FFFFFF;" id="white_display_button" onclick="display_column('white')">숨기기</button>
        </div>

        <div id="table_container">
            <table id="record_table">
                <thead>
                    <tr>
                        <th colspan="2" rowspan="2"></th>
                        <th colspan="22">난이도</th>
                    </tr>
                    <tr>
                        <th class="black black_header" bgcolor="#000000" colspan="2"></th>
                        <th class="brown brown_header" bgcolor="#A52A2A" colspan="2"></th>
                        <th class="gray gray_header" bgcolor="#808080" colspan="2"></th>
                        <th class="purple purple_header" bgcolor="#800080" colspan="2"></th>
                        <th class="pink pink_header" bgcolor="#FF00FF" colspan="2"></th>
                        <th class="red red_header" bgcolor="#FF0000" colspan="2"></th>
                        <th class="blue blue_header" bgcolor="#0000FF" colspan="2"></th>
                        <th class="green green_header" bgcolor="#00FF00" colspan="2"></th>
                        <th class="orange orange_header" bgcolor="#FF8000" colspan="2"></th>
                        <th class="yellow yellow_header" bgcolor="#FFFF00" colspan="2"></th>
                        <th class="white white_header" bgcolor="#FFFFFF" colspan="2">WHITE</th>
                    </tr>
                    <tr>
                        <th>날짜</th>
                        <th>지점</th>
                        <th class="black">성공</th>
                        <th class="black">시도</th>
                        <th class="brown">성공</th>
                        <th class="brown">시도</th>
                        <th class="gray">성공</th>
                        <th class="gray">시도</th>
                        <th class="purple">성공</th>
                        <th class="purple">시도</th>
                        <th class="pink">성공</th>
                        <th class="pink">시도</th>
                        <th class="red">성공</th>
                        <th class="red">시도</th>
                        <th class="blue">성공</th>
                        <th class="blue">시도</th>
                        <th class="green">성공</th>
                        <th class="green">시도</th>
                        <th class="orange">성공</th>
                        <th class="orange">시도</th>
                        <th class="yellow">성공</th>
                        <th class="yellow">시도</th>
                        <th class="white">성공</th>
                        <th class="white">시도</th>
                    </tr>
                </thead>
                <tbody id="record_tbody">
                </tbody>
            </table>
        </div>
        
    </body>
</html>
